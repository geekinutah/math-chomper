<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math Chomper</title>
    <link rel="stylesheet" href="/src/ui/styles.css" />
    <link rel="stylesheet" href="/src/input/touch.css" />
    <style>
      #game {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #board-wrap {
        position: relative;
      }
      #board {
        display: block;
      }
      #screens {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #screens .screen,
      #screens .mc-subscreen {
        pointer-events: auto;
      }
      #touch-controls {
        position: relative;
      }
      .mc-score-list {
        margin: 12px 0;
        font-size: 13px;
      }
      .mc-score-row {
        display: flex;
        gap: 12px;
        justify-content: center;
        padding: 1px 0;
      }
      .mc-score-name {
        min-width: 64px;
        text-align: left;
        color: var(--mc-accent);
      }
      .mc-score-value {
        min-width: 48px;
        text-align: right;
      }
      .mc-score-mode,
      .mc-score-band {
        color: var(--mc-dim);
      }
      .mc-scores-empty {
        font-size: 13px;
        color: var(--mc-dim);
      }
      .mc-initials {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        margin: 12px 0;
      }
      .mc-initials-input {
        font-family: inherit;
        font-size: 16px;
        text-transform: uppercase;
        text-align: center;
        background: var(--mc-bg);
        color: var(--mc-text);
        border: 2px solid var(--mc-accent);
        padding: 6px 10px;
      }
    </style>
  </head>
  <body>
    <div id="game">
      <div id="hud" class="hud"></div>
      <div id="board-wrap">
        <canvas id="board"></canvas>
        <div id="screens"></div>
      </div>
      <div id="touch-controls"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
